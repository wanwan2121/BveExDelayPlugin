name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dotnet build BveDelayEx.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: BveDelayEx
          path: |
            bin/Release/net48/BveDelayEx.dll
            bin/Release/net48/crack.png
